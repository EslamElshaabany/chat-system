services:

  mysql:
    image: mysql:8.4.9
    container_name: chat_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_system
      MYSQL_USER: chat_user
      MYSQL_PASSWORD: chat_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.13-alpine
    container_name: chat_redis
    command: >
      redis-server 
       --appendonly yes 
       --appendfsync everysec 
       --maxmemory 256mb 
       --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.19.14
    container_name: chat_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -v
            '\"status\":\"red\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis:6379
      # MYSQL_URL: chat_user:chat_pass@tcp(mysql:3306)/chat_system?parseTime=true
      PORT: 8081
      OTEL_COLLECTOR_HOST: otel-collector
      OTEL_TRACES_SAMPLER_RATIO: "1.0"
    depends_on:
      # mysql:
      #   condition: service_healthy
      redis:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # deploy:
    #   replicas: 3
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/readyz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chat_system?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: chat_user
      SPRING_DATASOURCE_PASSWORD: chat_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      OTEL_COLLECTOR_HOST: otel-collector
      OTEL_TRACES_SAMPLER_RATIO: "1.0"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
    # deploy:
    #   replicas: 2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: chat_nginx
    ports:
      - "3000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ingestion-service:
        condition: service_healthy
      core-service:
        condition: service_healthy

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.103.0
    container_name: chat_otel_collector
    volumes:
      - ./infra/otel-collector/otelcol-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - loki
      - tempo
      - prometheus

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: chat_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:3.1.0
    container_name: chat_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki

  tempo:
    image: grafana/tempo:2.5.0
    container_name: chat_tempo
    command: -config.file=/etc/tempo.yaml
    volumes:
      - ./infra/tempo/tempo-config.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo

  grafana:
    image: grafana/grafana:11.1.0
    container_name: chat_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  mysql_data:
  redis_data:
  es_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:
