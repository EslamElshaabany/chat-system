services:

  mysql:
    image: mysql:8.4.9
    container_name: chat_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: chat_system
      MYSQL_USER: chat_user
      MYSQL_PASSWORD: chat_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.13-alpine
    container_name: chat_redis
    command: >
      redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: elasticsearch:8.19.14
    container_name: chat_elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health | grep -v
            '\"status\":\"red\"'",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  ingestion-service:
    build:
      context: ./services/ingestion
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis:6379
      MYSQL_URL: chat_user:chat_pass@tcp(mysql:3306)/chat_system?parseTime=true
      PORT: 8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # deploy:
    #   replicas: 3
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/readyz || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: ./services/core
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/chat_system?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: chat_user
      SPRING_DATASOURCE_PASSWORD: chat_pass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    # deploy:
    #   replicas: 2
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    container_name: chat_nginx
    ports:
      - "3000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      ingestion-service:
        condition: service_healthy
      core-service:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  es_data:
