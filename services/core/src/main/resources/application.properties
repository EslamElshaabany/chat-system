spring.application.name=core
# ─── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ─── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/chat_system?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chat_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chat_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA ──────────────────────────────────────────────────────────────────────
