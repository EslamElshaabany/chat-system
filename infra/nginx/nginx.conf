events {
    worker_connections 1024;
}

http {

    upstream chat_core {
        server core-service:8080;
    }

    upstream chat_ingestion {
        server ingestion-service:8090;
    }

    server {
        listen 80;

        # shared proxy headers — applied in every block below
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # -------------------------------------------------------
        # POST /applications/{token}/chats
        # operationId: createChat → ingestion service
        # GET on same path falls through to core
        # -------------------------------------------------------
        location ~ ^/applications/[^/]+/chats$ {
            if ($request_method = POST) {
                proxy_pass http://chat_ingestion;
            }
            proxy_pass http://chat_core;
        }

        # -------------------------------------------------------
        # POST /applications/{token}/chats/{chatNumber}/messages
        # operationId: createMessage → ingestion service
        # GET on same path falls through to core
        # -------------------------------------------------------
        location ~ ^/applications/[^/]+/chats/[^/]+/messages$ {
            if ($request_method = POST) {
                proxy_pass http://chat_ingestion;
            }
            proxy_pass http://chat_core;
        }

        # -------------------------------------------------------
        # Everything else → core service
        # -------------------------------------------------------
        location / {
            proxy_pass http://chat_core;
        }
    }
}